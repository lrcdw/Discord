name: H12 Direct Missing7

on:
  push:
    branches: [h12-direct]
    paths:
      - '.github/workflows/h12-direct-missing7.yml'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Collect seven missing historical raws
        shell: bash
        env:
          ODDSPAPI_API_KEY: f3d3db6f-b598-4db6-a41d-2f0f81021fd5
        run: |
          set -euo pipefail
          mkdir -p h12_missing7_direct/raw_historical
          python - <<'PY'
          from pathlib import Path
          import os,requests,gzip,hashlib,csv,json,time
          KEY=os.environ['ODDSPAPI_API_KEY']; OUT=Path('h12_missing7_direct')
          ids=['id1000003561514148','id1000003561514154','id1000003561514156','id1000003561514158','id1000003561514160','id1000003561514162','id1000003561514164']
          rows=[]
          for fid in ids:
            last=None
            for a in range(8):
              try:
                r=requests.get('https://api.oddspapi.io/v4/historical-odds',params={'apiKey':KEY,'fixtureId':fid,'bookmakers':'pinnacle,bet365,singbet'},timeout=45); last=r
              except requests.RequestException:
                if a==7: raise
                time.sleep(min(2**a,20)); continue
              if r.status_code==200: break
              if r.status_code==429 or r.status_code>=500: time.sleep(min(2**a,20)); continue
              raise RuntimeError(f'HTTP {r.status_code} {fid} {r.text[:200]}')
            if last is None or last.status_code!=200: raise RuntimeError(f'FAILED {fid}')
            body=last.content; json.loads(body)
            rel=f'raw_historical/{fid}.json.gz'; (OUT/rel).write_bytes(gzip.compress(body,9))
            rows.append({'file':rel,'fixture_id':fid,'sha256_uncompressed':hashlib.sha256(body).hexdigest(),'uncompressed_bytes':len(body),'http_status':200,'endpoint':'/historical-odds'})
            print('DONE',fid,flush=True)
          with (OUT/'raw_manifest_missing7.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          for p in OUT.rglob('*'):
            if p.is_file() and KEY.encode() in p.read_bytes(): raise SystemExit('CREDENTIAL_LEAK')
          print('COMPLETE',len(rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h12-direct-missing7
          path: h12_missing7_direct
