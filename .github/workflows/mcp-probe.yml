name: MCP Odds Audit Probe

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Sports Game Odds MCP
        shell: bash
        run: |
          python - <<'PY'
          import json, requests, pathlib

          URL = 'https://gateway.pipeworx.io/sports-game-odds/mcp'
          base_headers = {
              'Content-Type': 'application/json',
              'Accept': 'application/json, text/event-stream',
          }

          def parse(resp):
              text = resp.text
              if 'text/event-stream' in resp.headers.get('content-type',''):
                  vals=[]
                  for line in text.splitlines():
                      if line.startswith('data:'):
                          raw=line[5:].strip()
                          try: vals.append(json.loads(raw))
                          except Exception: pass
                  return vals[-1] if vals else {'raw': text[:4000]}
              try: return resp.json()
              except Exception: return {'raw': text[:4000]}

          init = {
              'jsonrpc':'2.0','id':1,'method':'initialize',
              'params':{
                  'protocolVersion':'2025-03-26',
                  'capabilities':{},
                  'clientInfo':{'name':'corners-lab-audit','version':'1.0'}
              }
          }
          r=requests.post(URL,headers=base_headers,json=init,timeout=40)
          out={'initialize_status':r.status_code,'initialize':parse(r)}
          session=r.headers.get('mcp-session-id') or r.headers.get('Mcp-Session-Id')
          h=dict(base_headers)
          if session: h['Mcp-Session-Id']=session

          try:
              requests.post(URL,headers=h,json={'jsonrpc':'2.0','method':'notifications/initialized','params':{}},timeout=20)
          except Exception:
              pass

          q={'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}}
          r2=requests.post(URL,headers=h,json=q,timeout=40)
          out['tools_status']=r2.status_code
          out['tools']=parse(r2)
          out['session_present']=bool(session)
          pathlib.Path('mcp_probe.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2)[:12000])
          if r2.status_code >= 400:
              raise SystemExit(2)
          PY
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-odds-probe
          path: mcp_probe.json
