name: Secure OddsPapi H12 Raw Collector

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-oddspapi-h12-collector.yml'

permissions:
  contents: write

env:
  FROZEN_ARTIFACT_ID: '9649446403'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ephemeral key exchange and parallel raw collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'corners-lab-runner'
          git config user.email 'corners-lab-runner@users.noreply.github.com'
          EX=secure_exchange_h12c
          mkdir -p "$EX"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out "$EX/public_key.pem" >/dev/null 2>&1
          printf '%s\n' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$EX/session.txt"
          git rm -f --ignore-unmatch "$EX/ciphertext.hex" >/dev/null 2>&1 || true
          git add "$EX/public_key.pem" "$EX/session.txt"
          git commit -m "Publish ephemeral H12 collector key ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:master
          for i in $(seq 1 120); do
            git fetch origin master >/dev/null 2>&1 || true
            if git cat-file -e origin/master:"$EX/ciphertext.hex" 2>/dev/null; then
              git show origin/master:"$EX/ciphertext.hex" > /tmp/ciphertext.hex
              break
            fi
            sleep 3
          done
          test -s /tmp/ciphertext.hex
          xxd -r -p /tmp/ciphertext.hex > /tmp/secret.enc
          test "$(stat -c%s /tmp/secret.enc)" -eq 384
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.enc -out /tmp/api_key.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/api_key.txt

          mkdir -p /tmp/frozen h12_collector/raw_historical
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${FROZEN_ARTIFACT_ID}/zip > /tmp/frozen.zip
          unzip -q /tmp/frozen.zip -d /tmp/frozen
          cp /tmp/frozen/eligible_fixtures.csv h12_collector/eligible_fixtures_frozen.csv
          cp /tmp/frozen/market_catalog_target.csv h12_collector/market_catalog_target_frozen.csv

          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import csv, gzip, hashlib, json, requests, time
          KEY=Path('/tmp/api_key.txt').read_text().strip()
          BASE='https://api.oddspapi.io/v4/historical-odds'
          BOOKS='pinnacle,bet365,singbet'
          OUT=Path('h12_collector'); RAW=OUT/'raw_historical'
          fixtures=list(csv.DictReader((OUT/'eligible_fixtures_frozen.csv').open(encoding='utf-8')))
          if len(fixtures)!=179: raise SystemExit(f'FROZEN_DENOMINATOR_FAIL:{len(fixtures)}')
          counts={}
          for f in fixtures: counts[f['competition']]=counts.get(f['competition'],0)+1
          expected={'Premier League':30,'Championship':73,'Bundesliga':36,'LaLiga':40}
          if counts!=expected: raise SystemExit(f'FROZEN_COUNTS_FAIL:{counts}')

          def fetch_one(f):
            params={'apiKey':KEY,'fixtureId':f['fixture_id'],'bookmakers':BOOKS}
            calls=retries=0; last=None
            for attempt in range(8):
              calls+=1
              try:
                r=requests.get(BASE,params=params,timeout=35); last=r
              except requests.RequestException:
                retries+=1
                if attempt==7: raise
                time.sleep(min(1.5*(attempt+1),10)); continue
              if r.status_code==429 or r.status_code>=500:
                retries+=1; time.sleep(min(2**attempt,20)); continue
              if r.status_code!=200:
                raise RuntimeError(f'HTTP_{r.status_code}_fixture_{f["fixture_id"]}:{r.text[:200]}')
              r.json()
              return f['fixture_id'],r.content,calls,retries
            raise RuntimeError(f'RETRY_EXHAUSTED_{f["fixture_id"]}_{None if last is None else last.status_code}')

          manifest=[]; total_calls=total_retries=0; done=0
          with ThreadPoolExecutor(max_workers=5) as ex:
            futs={ex.submit(fetch_one,f):f for f in fixtures}
            for fut in as_completed(futs):
              fid,body,calls,retries=fut.result(); done+=1
              total_calls+=calls; total_retries+=retries
              rel=f'raw_historical/{fid}.json.gz'
              (OUT/rel).write_bytes(gzip.compress(body,compresslevel=9))
              manifest.append({'file':rel,'fixture_id':fid,'sha256_uncompressed':hashlib.sha256(body).hexdigest(),'uncompressed_bytes':len(body),'http_status':200,'endpoint':'/historical-odds'})
              if done%20==0 or done==len(fixtures): print('COLLECTED',done,'OF',len(fixtures),flush=True)
          manifest.sort(key=lambda x:str(x['fixture_id']))
          with (OUT/'raw_manifest_H12.csv').open('w',newline='',encoding='utf-8') as fp:
            w=csv.DictWriter(fp,fieldnames=list(manifest[0])); w.writeheader(); w.writerows(manifest)
          summary={'collector_version':'H12_RAW_COLLECTOR_1.0','raw_files':len(manifest),'api_calls_including_retries':total_calls,'retries':total_retries,'credential_persisted':False,'bookmakers':['pinnacle','bet365','singbet'],'denominator':counts}
          (OUT/'collector_summary.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          secret=KEY.encode()
          for p in OUT.rglob('*'):
            if p.is_file() and secret in p.read_bytes(): raise SystemExit('CREDENTIAL_LEAK:'+str(p))
          print(json.dumps(summary))
          PY
          rm -f /tmp/api_key.txt /tmp/secret.enc /tmp/private.pem /tmp/ciphertext.hex
      - name: Upload raw collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-h12-raw-collector
          path: h12_collector
          compression-level: 6
