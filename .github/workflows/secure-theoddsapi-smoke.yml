name: Secure The Odds API Current Market Smoke

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-theoddsapi-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Generate ephemeral RSA exchange key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out public_key.pem >/dev/null 2>&1
          printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID" > exchange_info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: theoddsapi-smoke-public-key-${{ github.run_id }}
          path: |
            public_key.pem
            exchange_info.txt
      - name: Receive encrypted credential and current discovery
        shell: bash
        run: |
          set -euo pipefail
          CIPHER_PATH="secure_exchange_h14/${GITHUB_RUN_ID}.dec"
          for i in $(seq 1 300); do
            git fetch -q origin master
            if git cat-file -e "origin/master:${CIPHER_PATH}" 2>/dev/null; then
              git show "origin/master:${CIPHER_PATH}" >/tmp/ciphertext_source.txt
              break
            fi
            sleep 2
          done
          test -s /tmp/ciphertext_source.txt
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          tokens=[t.strip() for t in Path('/tmp/ciphertext_source.txt').read_text().replace('\n',',').split(',') if t.strip()]
          if len(tokens)!=384 or not all(re.fullmatch(r'\d{1,3}',t) for t in tokens): raise SystemExit(f'BAD_CIPHER count={len(tokens)}')
          vals=[int(t) for t in tokens]
          if any(v<0 or v>255 for v in vals): raise SystemExit('BAD_BYTE_RANGE')
          p=subprocess.run(['openssl','pkeyutl','-decrypt','-inkey','/tmp/private.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-pkeyopt','rsa_mgf1_md:sha256'],input=bytes(vals),capture_output=True)
          if p.returncode or not re.fullmatch(rb'[A-Za-z0-9_-]{20,128}',p.stdout): raise SystemExit('RSA_FAIL')
          Path('/tmp/api_key.txt').write_bytes(p.stdout)
          print(f'RSA_OK KEY_LEN={len(p.stdout)}')
          PY
          THE_ODDS_API_KEY="$(cat /tmp/api_key.txt)" python h14/discover_current_books_theoddsapi.py
          rm -f /tmp/api_key.txt /tmp/private.pem /tmp/ciphertext_source.txt public_key.pem exchange_info.txt
      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h14-current-discovery-${{ github.run_id }}
          path: h14_current_discovery
          if-no-files-found: warn
