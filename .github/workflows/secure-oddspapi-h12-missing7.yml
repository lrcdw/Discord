name: Secure OddsPapi H12 Missing7 Collector

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-oddspapi-h12-missing7.yml'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Collect frozen missing seven
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'corners-lab-runner'
          git config user.email 'corners-lab-runner@users.noreply.github.com'
          EX=secure_exchange_h12m
          mkdir -p "$EX"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out "$EX/public_key.pem" >/dev/null 2>&1
          printf '%s\n' "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > "$EX/session.txt"
          git rm -f --ignore-unmatch "$EX/ciphertext.hex" >/dev/null 2>&1 || true
          git add "$EX/public_key.pem" "$EX/session.txt"
          git commit -m "Publish ephemeral H12M key ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin HEAD:master
          for i in $(seq 1 90); do
            git fetch origin master >/dev/null 2>&1 || true
            if git cat-file -e origin/master:"$EX/ciphertext.hex" 2>/dev/null; then git show origin/master:"$EX/ciphertext.hex" >/tmp/ciphertext.hex; break; fi
            sleep 2
          done
          test -s /tmp/ciphertext.hex
          xxd -r -p /tmp/ciphertext.hex >/tmp/secret.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.enc -out /tmp/api_key.txt -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          mkdir -p h12_missing7/raw_historical
          python - <<'PY'
          from pathlib import Path
          import requests,gzip,hashlib,csv,json,time
          KEY=Path('/tmp/api_key.txt').read_text().strip(); OUT=Path('h12_missing7')
          ids=['id1000003561514148','id1000003561514154','id1000003561514156','id1000003561514158','id1000003561514160','id1000003561514162','id1000003561514164']
          rows=[]
          for fid in ids:
            last=None
            for a in range(8):
              r=requests.get('https://api.oddspapi.io/v4/historical-odds',params={'apiKey':KEY,'fixtureId':fid,'bookmakers':'pinnacle,bet365,singbet'},timeout=45); last=r
              if r.status_code==200: break
              if r.status_code==429 or r.status_code>=500: time.sleep(min(2**a,20)); continue
              raise RuntimeError(f'HTTP {r.status_code} {fid} {r.text[:200]}')
            if last is None or last.status_code!=200: raise RuntimeError(f'FAILED {fid}')
            body=last.content; json.loads(body)
            rel=f'raw_historical/{fid}.json.gz'; (OUT/rel).write_bytes(gzip.compress(body,9))
            rows.append({'file':rel,'fixture_id':fid,'sha256_uncompressed':hashlib.sha256(body).hexdigest(),'uncompressed_bytes':len(body),'http_status':200,'endpoint':'/historical-odds'})
            print('DONE',fid,flush=True)
          with (OUT/'raw_manifest_missing7.csv').open('w',newline='',encoding='utf-8') as f:
            w=csv.DictWriter(f,fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          secret=KEY.encode()
          for p in OUT.rglob('*'):
            if p.is_file() and secret in p.read_bytes(): raise SystemExit('CREDENTIAL_LEAK')
          PY
          rm -f /tmp/api_key.txt /tmp/private.pem /tmp/secret.enc /tmp/ciphertext.hex
      - uses: actions/upload-artifact@v4
        with:
          name: oddspapi-h12-missing7
          path: h12_missing7
