name: Secure The Odds API H1.4 Frozen Holdout v3

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-theoddsapi-h14-v3.yml'

permissions:
  contents: read

jobs:
  h14:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Generate ephemeral RSA exchange key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out public_key.pem >/dev/null 2>&1
          printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID" > exchange_info.txt
          echo RSA_READY
      - name: Upload ephemeral public key
        uses: actions/upload-artifact@v4
        with:
          name: h14-v3-public-key-${{ github.run_id }}
          path: |
            public_key.pem
            exchange_info.txt
      - name: Wait for encrypted credential and execute frozen H1.4
        shell: bash
        run: |
          set -euo pipefail
          CIPHER_PATH="secure_exchange_h14/${GITHUB_RUN_ID}.hex"
          FOUND=0
          for i in $(seq 1 300); do
            git fetch -q origin master
            if git cat-file -e "origin/master:${CIPHER_PATH}" 2>/dev/null; then
              git show "origin/master:${CIPHER_PATH}" >/tmp/ciphertext_source.txt
              FOUND=1
              break
            fi
            sleep 2
          done
          test "$FOUND" -eq 1
          echo CIPHER_GIT_FOUND
          python - <<'PY'
          import re, subprocess
          from pathlib import Path

          text=Path('/tmp/ciphertext_source.txt').read_text(encoding='utf-8',errors='ignore')
          hexchars=''.join(re.findall(r'[0-9a-fA-F]', text))
          print(f'HEXCHARS_TOTAL={len(hexchars)}')
          if len(hexchars) < 768 or len(hexchars) > 900:
              raise SystemExit('FAIL_CIPHER_HEX_LENGTH')

          successes=[]
          for start in range(len(hexchars)-768+1):
              window=hexchars[start:start+768]
              enc=bytes.fromhex(window)
              p=subprocess.run([
                  'openssl','pkeyutl','-decrypt',
                  '-inkey','/tmp/private.pem',
                  '-pkeyopt','rsa_padding_mode:oaep',
                  '-pkeyopt','rsa_oaep_md:sha256',
                  '-pkeyopt','rsa_mgf1_md:sha256'
              ], input=enc, capture_output=True)
              if p.returncode==0:
                  plain=p.stdout
                  if re.fullmatch(rb'[A-Za-z0-9_-]{20,128}', plain):
                      successes.append((start, plain))

          if len(successes)!=1:
              raise SystemExit(f'FAIL_RSA_WINDOW_SUCCESS_COUNT={len(successes)}')
          start,plain=successes[0]
          Path('/tmp/api_key.txt').write_bytes(plain)
          print(f'RSA_WINDOW_OK START={start} KEY_LEN={len(plain)}')
          PY
          test -s /tmp/api_key.txt
          THE_ODDS_API_KEY="$(cat /tmp/api_key.txt)" python h14/run_h14_theoddsapi_v2.py
          rm -f /tmp/api_key.txt /tmp/private.pem /tmp/ciphertext_source.txt public_key.pem exchange_info.txt
      - name: Upload H1.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h14-theoddsapi-evidence-${{ github.run_id }}
          path: h14_runtime
          if-no-files-found: warn
