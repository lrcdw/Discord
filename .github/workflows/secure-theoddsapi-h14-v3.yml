name: Secure The Odds API H1.4 Frozen Holdout v3

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-theoddsapi-h14-v3.yml'

permissions:
  contents: read

jobs:
  h14:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Generate ephemeral RSA exchange key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out public_key.pem >/dev/null 2>&1
          printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID" > exchange_info.txt
          echo RSA_READY
      - name: Upload ephemeral public key
        uses: actions/upload-artifact@v4
        with:
          name: h14-v3-public-key-${{ github.run_id }}
          path: |
            public_key.pem
            exchange_info.txt
      - name: Wait for encrypted credential and execute frozen H1.4
        shell: bash
        run: |
          set -euo pipefail
          CIPHER_PATH="secure_exchange_h14/${GITHUB_RUN_ID}.dec"
          FOUND=0
          for i in $(seq 1 300); do
            git fetch -q origin master
            if git cat-file -e "origin/master:${CIPHER_PATH}" 2>/dev/null; then
              git show "origin/master:${CIPHER_PATH}" >/tmp/ciphertext_source.txt
              FOUND=1
              break
            fi
            sleep 2
          done
          test "$FOUND" -eq 1
          echo CIPHER_DECIMAL_GIT_FOUND
          python - <<'PY'
          import re, subprocess
          from pathlib import Path

          text=Path('/tmp/ciphertext_source.txt').read_text(encoding='utf-8',errors='strict').strip()
          tokens=[t.strip() for t in text.replace('\n',',').split(',') if t.strip()]
          if len(tokens)!=384:
              raise SystemExit(f'FAIL_CIPHER_BYTE_COUNT={len(tokens)}')
          if not all(re.fullmatch(r'\d{1,3}', t) for t in tokens):
              raise SystemExit('FAIL_CIPHER_TOKEN_FORMAT')
          vals=[int(t) for t in tokens]
          if not all(0 <= v <= 255 for v in vals):
              raise SystemExit('FAIL_CIPHER_BYTE_RANGE')
          enc=bytes(vals)
          print(f'CIPHER_DECIMAL_OK BYTES={len(enc)}')
          p=subprocess.run([
              'openssl','pkeyutl','-decrypt',
              '-inkey','/tmp/private.pem',
              '-pkeyopt','rsa_padding_mode:oaep',
              '-pkeyopt','rsa_oaep_md:sha256',
              '-pkeyopt','rsa_mgf1_md:sha256'
          ], input=enc, capture_output=True)
          if p.returncode!=0:
              raise SystemExit('FAIL_RSA_OAEP_DECRYPT')
          plain=p.stdout
          if not re.fullmatch(rb'[A-Za-z0-9_-]{20,128}', plain):
              raise SystemExit('FAIL_DECRYPTED_KEY_FORMAT')
          Path('/tmp/api_key.txt').write_bytes(plain)
          print(f'RSA_DECIMAL_OK KEY_LEN={len(plain)}')
          PY
          test -s /tmp/api_key.txt
          THE_ODDS_API_KEY="$(cat /tmp/api_key.txt)" python h14/run_h14_theoddsapi_v2.py
          rm -f /tmp/api_key.txt /tmp/private.pem /tmp/ciphertext_source.txt public_key.pem exchange_info.txt
      - name: Upload H1.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h14-theoddsapi-evidence-${{ github.run_id }}
          path: h14_runtime
          if-no-files-found: warn
