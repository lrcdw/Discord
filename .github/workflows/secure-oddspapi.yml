name: Secure OddsPapi Discovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-oddspapi.yml'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ephemeral key exchange and OddsPapi discovery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'corners-lab-runner'
          git config user.email 'corners-lab-runner@users.noreply.github.com'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p secure_exchange
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out secure_exchange/public_key.pem >/dev/null 2>&1
          printf '%s\n' "$SESSION" > secure_exchange/session.txt
          git rm -f --ignore-unmatch secure_exchange/ciphertext.b64 secure_exchange/ciphertext.hex >/dev/null 2>&1 || true
          git add secure_exchange/public_key.pem secure_exchange/session.txt
          git commit -m "Publish ephemeral audit public key $SESSION"
          git push origin HEAD:master

          echo 'Ephemeral public key published; polling for encrypted credential.'
          for i in $(seq 1 90); do
            git pull --rebase origin master >/dev/null 2>&1 || true
            if [ -s secure_exchange/ciphertext.hex ]; then break; fi
            sleep 3
          done
          test -s secure_exchange/ciphertext.hex
          tr -d '\r\n ' < secure_exchange/ciphertext.hex | xxd -r -p > /tmp/secret.enc
          test "$(stat -c%s /tmp/secret.enc)" -eq 384
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.enc -out /tmp/api_key.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/api_key.txt

          python - <<'PY'
          import json, pathlib, requests
          BASE='https://api.oddspapi.io/v4'
          key=pathlib.Path('/tmp/api_key.txt').read_text().strip()
          if not key: raise SystemExit('EMPTY_KEY')
          s=requests.Session()

          def get(ep, **params):
              params['apiKey']=key
              r=s.get(BASE+ep,params=params,timeout=60)
              try: data=r.json()
              except Exception: data={'_non_json':r.text[:2000]}
              if r.status_code>=400:
                  safe={'endpoint':ep,'status':r.status_code,'response_type':type(data).__name__}
                  if isinstance(data,dict):
                      safe['keys']=sorted(data.keys())
                      safe['message']=data.get('message') or data.get('error')
                  raise RuntimeError(json.dumps(safe))
              return data

          def seq(data, *keys):
              if isinstance(data,list): return data
              if isinstance(data,dict):
                  for k in keys:
                      v=data.get(k)
                      if isinstance(v,list): return v
              return []

          account=get('/account')
          active=[]
          if isinstance(account,dict):
              active=[x for x in (account.get('subscriptions') or []) if isinstance(x,dict) and x.get('is_active')]
          acct={
              'auth_ok':True,
              'active_subscription_count':len(active),
              'subscriptions':[{
                  'price':x.get('price'),'request_limit':x.get('request_limit'),
                  'request_count':x.get('request_count'),'sport_ids':x.get('sport_ids'),
                  'bookmakers':sorted((x.get('bookmakers') or {}).keys()) if isinstance(x.get('bookmakers'),dict) else x.get('bookmakers'),
                  'websocket_access':x.get('websocket_access')
              } for x in active]
          }
          markets_raw=get('/markets',language='en')
          markets=seq(markets_raw,'markets','data','results')
          corner=[]
          for m in markets:
              if not isinstance(m,dict): continue
              text=' '.join(str(m.get(k) or '') for k in ('marketName','marketNameShort','marketType','period','name','slug')).lower()
              if 'corner' in text:
                  corner.append(m)
          tournaments_raw=get('/tournaments',sportId=10,language='en')
          tournaments=seq(tournaments_raw,'tournaments','data','results')
          targets=[]
          wanted=('premier league','championship','bundesliga','la liga')
          for t in tournaments:
              if not isinstance(t,dict): continue
              hay=' '.join(str(t.get(k) or '') for k in ('tournamentName','tournamentSlug','categoryName','categorySlug','name','slug')).lower()
              if any(w in hay for w in wanted): targets.append(t)
          out={
              'account':acct,
              'markets_response_type':type(markets_raw).__name__,
              'market_count':len(markets),
              'corner_market_count':len(corner),
              'corner_markets':corner,
              'tournaments_response_type':type(tournaments_raw).__name__,
              'target_tournaments':targets,
              'all_tournament_count':len(tournaments),
          }
          pathlib.Path('oddspapi_discovery.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          print('AUTH_OK',acct['auth_ok'])
          print('ACTIVE_SUBSCRIPTIONS',len(active))
          print('MARKETS',len(markets),'CORNER_MARKETS',len(corner))
          print('TOURNAMENTS',len(tournaments),'TARGETS',len(targets))
          PY
          rm -f /tmp/api_key.txt /tmp/secret.enc /tmp/private.pem
      - name: Upload sanitized discovery
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-discovery
          path: oddspapi_discovery.json
