name: Secure OddsPapi Historical Coverage H12

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-oddspapi.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ephemeral key exchange and corrected historical census
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'corners-lab-runner'
          git config user.email 'corners-lab-runner@users.noreply.github.com'
          SESSION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p secure_exchange
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out secure_exchange/public_key.pem >/dev/null 2>&1
          printf '%s\n' "$SESSION" > secure_exchange/session.txt
          rm -f secure_exchange/ciphertext.hex
          git add secure_exchange/public_key.pem secure_exchange/session.txt
          git commit -m "Publish ephemeral H12 public key $SESSION"
          git push origin HEAD:master
          echo 'Ephemeral public key published; polling for encrypted credential.'
          for i in $(seq 1 120); do
            git pull --rebase origin master >/dev/null 2>&1 || true
            if [ -s secure_exchange/ciphertext.hex ]; then break; fi
            sleep 3
          done
          test -s secure_exchange/ciphertext.hex
          xxd -r -p secure_exchange/ciphertext.hex > /tmp/secret.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/secret.enc -out /tmp/api_key.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          chmod 600 /tmp/api_key.txt

          mkdir -p audit_input /tmp/frozen_artifact
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9649446403/zip > /tmp/frozen_artifact.zip
          unzip -q /tmp/frozen_artifact.zip -d /tmp/frozen_artifact
          cp /tmp/frozen_artifact/eligible_fixtures.csv audit_input/eligible_fixtures.csv
          cp /tmp/frozen_artifact/market_catalog_target.csv audit_input/market_catalog_target.csv
          echo "FROZEN_INPUT_SHA256 $(sha256sum audit_input/eligible_fixtures.csv audit_input/market_catalog_target.csv | tr '\n' ' ')"

          python - <<'PYCODE'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import csv, gzip, hashlib, json, time, requests
          from collections import defaultdict, Counter

          ROOT=Path('.')
          OUT=ROOT/'h12_output'; RAW=OUT/'raw_historical'
          OUT.mkdir(exist_ok=True); RAW.mkdir(exist_ok=True)
          key=Path('/tmp/api_key.txt').read_text().strip()
          if not key: raise SystemExit('EMPTY_KEY')
          BASE='https://api.oddspapi.io/v4'
          BOOKS=['pinnacle','bet365','singbet']
          HORIZONS=[60,30,15]
          MAX_AGE=300.0
          PASS_RATE=.90; PARTIAL=.70; BOOK_ADMIT=.80; MIN_N=25

          def dt(x):
              if not x: return None
              x=str(x).replace('Z','+00:00')
              d=datetime.fromisoformat(x)
              if d.tzinfo is None: d=d.replace(tzinfo=timezone.utc)
              return d.astimezone(timezone.utc)
          def fmt(d): return d.isoformat().replace('+00:00','Z') if d else None
          def sha(b): return hashlib.sha256(b).hexdigest()
          def write_csv(path, rows, fields=None):
              rows=list(rows)
              if fields is None:
                  fields=list(rows[0].keys()) if rows else []
              with open(path,'w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(rows)

          fixtures=list(csv.DictReader(open('audit_input/eligible_fixtures.csv',encoding='utf-8')))
          cats=list(csv.DictReader(open('audit_input/market_catalog_target.csv',encoding='utf-8')))
          for f in fixtures:
              f['tournament_id']=int(f['tournament_id']); f['kickoff_dt']=dt(f['kickoff_utc'])
          for c in cats:
              c['market_id']=int(c['market_id']); c['line']=float(c['line']); c['over_outcome_id']=int(c['over_outcome_id']); c['under_outcome_id']=int(c['under_outcome_id'])
          cats_by_family=defaultdict(list)
          for c in cats: cats_by_family[c['market_family']].append(c)
          comps={}
          for f in fixtures: comps[f['competition']]=f['tournament_id']
          eligible_counts={c:sum(1 for f in fixtures if f['competition']==c) for c in comps}
          if any(n<MIN_N for n in eligible_counts.values()):
              raise SystemExit('FROZEN_DENOMINATOR_BELOW_MINIMUM '+repr(eligible_counts))

          s=requests.Session(); call_count=0; retries=0; raw_manifest=[]
          all_hist={}
          for idx,f in enumerate(fixtures,1):
              params={'apiKey':key,'fixtureId':f['fixture_id'],'bookmakers':','.join(BOOKS)}
              for attempt in range(7):
                  call_count+=1
                  r=s.get(BASE+'/historical-odds',params=params,timeout=120)
                  if r.status_code==429:
                      retries+=1; time.sleep(min(2**attempt,30)); continue
                  if r.status_code>=500:
                      retries+=1; time.sleep(min(2**attempt,30)); continue
                  break
              if r.status_code!=200:
                  raise RuntimeError(f'historical-odds HTTP {r.status_code} fixture={f["fixture_id"]} body={r.text[:300]}')
              body=r.content
              hist=r.json()
              all_hist[f['fixture_id']]=hist
              rel=f'raw_historical/{f["fixture_id"]}.json.gz'
              with gzip.open(OUT/rel,'wb',compresslevel=9) as gz: gz.write(body)
              raw_manifest.append({'file':rel,'fixture_id':f['fixture_id'],'sha256_uncompressed':sha(body),'uncompressed_bytes':len(body),'http_status':r.status_code,'endpoint':'/historical-odds'})
              if idx % 25 == 0: print('HISTORICAL_DONE',idx,'OF',len(fixtures))
              time.sleep(0.03)

          def snaps(hist, book, mid, oid):
              try:
                  arr=hist['bookmakers'][book]['markets'][str(mid)]['outcomes'][str(oid)]['players']['0']
              except (KeyError,TypeError):
                  return []
              return arr if isinstance(arr,list) else []

          def latest_at(arr, asof):
              best=None; best_dt=None
              for x in arr:
                  t=dt(x.get('createdAt')) if isinstance(x,dict) else None
                  if t is None or t>asof: continue
                  if best_dt is None or t>best_dt:
                      best=x; best_dt=t
              return best,best_dt

          snapshot_stats={}
          duplicate_conflicts=0
          for f in fixtures:
              hist=all_hist[f['fixture_id']]
              for book in BOOKS:
                  for c in cats:
                      over=snaps(hist,book,c['market_id'],c['over_outcome_id'])
                      under=snaps(hist,book,c['market_id'],c['under_outcome_id'])
                      target=over+under
                      with_ts=sum(1 for x in target if isinstance(x,dict) and dt(x.get('createdAt')) is not None)
                      conflicts=0
                      for arr in (over,under):
                          seen={}
                          for x in arr:
                              if not isinstance(x,dict) or not x.get('createdAt'): continue
                              k=x['createdAt']; price=x.get('price')
                              if k in seen and seen[k]!=price: conflicts+=1
                              seen[k]=price
                      duplicate_conflicts += conflicts
                      snapshot_stats[(f['fixture_id'],book,c['market_id'])]=(len(target),with_ts,conflicts)

          event_rows=[]
          for f in fixtures:
              hist=all_hist[f['fixture_id']]; ko=f['kickoff_dt']
              for fam in ['TOTAL_CORNERS','HOME_TEAM_TOTAL_CORNERS','AWAY_TEAM_TOTAL_CORNERS']:
                  subject = None if fam=='TOTAL_CORNERS' else (f['home'] if fam.startswith('HOME') else f['away'])
                  for book in BOOKS:
                      for hm in HORIZONS:
                          asof=ko-timedelta(minutes=hm)
                          valid=[]; ages=[]; ts_target=0; ts_with=0; confs=0
                          for c in cats_by_family[fam]:
                              ov=snaps(hist,book,c['market_id'],c['over_outcome_id']); un=snaps(hist,book,c['market_id'],c['under_outcome_id'])
                              a,b,cconf=snapshot_stats[(f['fixture_id'],book,c['market_id'])]
                              ts_target+=a; ts_with+=b; confs+=cconf
                              os,ot=latest_at(ov,asof); us,ut=latest_at(un,asof)
                              if not os or not us or ot is None or ut is None: continue
                              try: op=float(os.get('price')); up=float(us.get('price'))
                              except Exception: continue
                              if op<=1 or up<=1: continue
                              if os.get('active') is False or us.get('active') is False: continue
                              oa=(asof-ot).total_seconds(); ua=(asof-ut).total_seconds()
                              if oa<0 or ua<0 or oa>MAX_AGE or ua>MAX_AGE: continue
                              valid.append(c['line']); ages.extend([oa,ua])
                          event_rows.append({
                              'competition':f['competition'],'tournament_id':f['tournament_id'],'fixture_id':f['fixture_id'],
                              'kickoff_utc':fmt(ko),'home':f['home'],'away':f['away'],'market_family':fam,'subject':subject,
                              'bookmaker':book,'horizon_minutes':hm,'prediction_as_of':fmt(asof),'covered':bool(valid),
                              'valid_pair_count':len(valid),'freshest_age_seconds':min(ages) if ages else None,
                              'max_selected_side_age_seconds':max(ages) if ages else None,
                              'line_min':min(valid) if valid else None,'line_max':max(valid) if valid else None,
                              'valid_lines':';'.join(str(x) for x in sorted(valid)) if valid else None,
                              'target_snapshots':ts_target,'snapshots_with_timestamp':ts_with,
                              'duplicate_timestamp_price_conflicts':confs
                          })

          coverage=[]; bookmaker_cells=[]
          for comp,tid in comps.items():
              compfix=[f for f in fixtures if f['competition']==comp]; denom=len(compfix)
              for fam in ['TOTAL_CORNERS','HOME_TEAM_TOTAL_CORNERS','AWAY_TEAM_TOTAL_CORNERS']:
                  for hm in HORIZONS:
                      subset=[r for r in event_rows if r['competition']==comp and r['market_family']==fam and r['horizon_minutes']==hm]
                      byfix=defaultdict(list)
                      for r in subset: byfix[r['fixture_id']].append(r)
                      covered=sum(1 for fid,rr in byfix.items() if any(x['covered'] for x in rr))
                      target=sum(r['target_snapshots'] for r in subset); withts=sum(r['snapshots_with_timestamp'] for r in subset)
                      tcr=1.0 if target==0 else withts/target
                      rates=covered/denom if denom else 0
                      valid_lines=[]
                      for r in subset:
                          if r['valid_lines']:
                              valid_lines += [float(x) for x in r['valid_lines'].split(';')]
                      if denom<MIN_N: status='FAIL_SAMPLE'
                      elif tcr<1.0: status='FAIL_TEMPORAL'
                      elif rates>=PASS_RATE: status='PASS'
                      elif rates>=PARTIAL: status='PARTIAL'
                      else: status='FAIL_COVERAGE'
                      coverage.append({'competition':comp,'tournament_id':tid,'market_family':fam,'horizon_minutes':hm,
                          'eligible_fixtures':denom,'covered_any_benchmark':covered,'coverage_rate':rates,
                          'timestamp_complete_rate':tcr,'target_snapshots':target,'status':status,
                          'observed_line_min':min(valid_lines) if valid_lines else None,'observed_line_max':max(valid_lines) if valid_lines else None})
                      for book in BOOKS:
                          bs=[r for r in subset if r['bookmaker']==book]
                          bc=sum(1 for r in bs if r['covered']); bt=sum(r['target_snapshots'] for r in bs); bw=sum(r['snapshots_with_timestamp'] for r in bs)
                          bookmaker_cells.append({'competition':comp,'tournament_id':tid,'market_family':fam,'horizon_minutes':hm,'bookmaker':book,
                              'eligible_fixtures':denom,'covered_fixtures':bc,'coverage_rate':bc/denom if denom else 0,
                              'timestamp_complete_rate':1.0 if bt==0 else bw/bt,'target_snapshots':bt})

          admissions=[]
          for comp,tid in comps.items():
              for fam in ['TOTAL_CORNERS','HOME_TEAM_TOTAL_CORNERS','AWAY_TEAM_TOTAL_CORNERS']:
                  for book in BOOKS:
                      cells=[r for r in bookmaker_cells if r['competition']==comp and r['market_family']==fam and r['bookmaker']==book]
                      admitted=len(cells)==3 and all(r['coverage_rate']>=BOOK_ADMIT and r['timestamp_complete_rate']==1.0 for r in cells)
                      admissions.append({'competition':comp,'tournament_id':tid,'market_family':fam,'bookmaker':book,'admitted':admitted,
                          'min_horizon_coverage_rate':min((r['coverage_rate'] for r in cells),default=0),
                          'all_timestamp_complete':all(r['timestamp_complete_rate']==1.0 for r in cells) if cells else False})

          cm_status=[]
          for comp,tid in comps.items():
              for fam in ['TOTAL_CORNERS','HOME_TEAM_TOTAL_CORNERS','AWAY_TEAM_TOTAL_CORNERS']:
                  cs=[r for r in coverage if r['competition']==comp and r['market_family']==fam]
                  statuses=[r['status'] for r in cs]
                  if statuses and all(x=='PASS' for x in statuses): st='PASS'
                  elif any(x.startswith('FAIL') for x in statuses): st='FAIL'
                  else: st='PARTIAL'
                  cm_status.append({'competition':comp,'tournament_id':tid,'market_family':fam,'status':st,
                      'min_coverage_rate':min((r['coverage_rate'] for r in cs),default=0),
                      'max_coverage_rate':max((r['coverage_rate'] for r in cs),default=0),
                      'admitted_bookmakers':';'.join(a['bookmaker'] for a in admissions if a['competition']==comp and a['market_family']==fam and a['admitted']) or None})

          closing_rows=[]
          for f in fixtures:
              hist=all_hist[f['fixture_id']]; ko=f['kickoff_dt']
              for fam in ['TOTAL_CORNERS','HOME_TEAM_TOTAL_CORNERS','AWAY_TEAM_TOTAL_CORNERS']:
                  subject=None if fam=='TOTAL_CORNERS' else (f['home'] if fam.startswith('HOME') else f['away'])
                  for book in BOOKS:
                      candidates=[]
                      for c in cats_by_family[fam]:
                          ov=snaps(hist,book,c['market_id'],c['over_outcome_id']); un=snaps(hist,book,c['market_id'],c['under_outcome_id'])
                          times=sorted({dt(x.get('createdAt')) for x in ov+un if isinstance(x,dict) and dt(x.get('createdAt')) and dt(x.get('createdAt'))<ko}, reverse=True)
                          for state_t in times:
                              os,ot=latest_at(ov,state_t); us,ut=latest_at(un,state_t)
                              if not os or not us: continue
                              try: op=float(os.get('price')); up=float(us.get('price'))
                              except Exception: continue
                              if op<=1 or up<=1 or os.get('active') is False or us.get('active') is False: continue
                              candidates.append((state_t,c['line'],ot,ut)); break
                      if candidates:
                          bt,line,ot,ut=max(candidates,key=lambda z:z[0])
                          closing_rows.append({'competition':f['competition'],'tournament_id':f['tournament_id'],'fixture_id':f['fixture_id'],
                            'market_family':fam,'subject':subject,'bookmaker':book,'closing_covered':True,
                            'latest_pair_state_time':fmt(bt),'closing_age_seconds':(ko-bt).total_seconds(),'latest_line':line,
                            'over_created_at':fmt(ot),'under_created_at':fmt(ut)})
                      else:
                          closing_rows.append({'competition':f['competition'],'tournament_id':f['tournament_id'],'fixture_id':f['fixture_id'],
                            'market_family':fam,'subject':subject,'bookmaker':book,'closing_covered':False,
                            'latest_pair_state_time':None,'closing_age_seconds':None,'latest_line':None,'over_created_at':None,'under_created_at':None})
          closing_summary=[]
          for comp,tid in comps.items():
              denom=eligible_counts[comp]
              for fam in ['TOTAL_CORNERS','HOME_TEAM_TOTAL_CORNERS','AWAY_TEAM_TOTAL_CORNERS']:
                  for book in BOOKS:
                      rr=[x for x in closing_rows if x['competition']==comp and x['market_family']==fam and x['bookmaker']==book]
                      n=sum(x['closing_covered'] for x in rr)
                      ages=[x['closing_age_seconds'] for x in rr if x['closing_covered']]
                      closing_summary.append({'competition':comp,'tournament_id':tid,'market_family':fam,'bookmaker':book,
                          'eligible_fixtures':denom,'closing_covered_fixtures':n,'closing_coverage_rate':n/denom if denom else 0,
                          'median_closing_age_seconds':sorted(ages)[len(ages)//2] if ages else None})

          write_csv(OUT/'event_market_book_horizon_H12.csv',event_rows)
          write_csv(OUT/'coverage_cells_H12.csv',coverage)
          write_csv(OUT/'bookmaker_coverage_cells_H12.csv',bookmaker_cells)
          write_csv(OUT/'bookmaker_admissions_H12.csv',admissions)
          write_csv(OUT/'competition_market_status_H12.csv',cm_status)
          write_csv(OUT/'closing_event_book_H12.csv',closing_rows)
          write_csv(OUT/'closing_summary_H12.csv',closing_summary)
          write_csv(OUT/'raw_manifest_H12.csv',raw_manifest)
          (OUT/'eligible_fixtures_frozen.csv').write_bytes(Path('audit_input/eligible_fixtures.csv').read_bytes())
          (OUT/'market_catalog_target_frozen.csv').write_bytes(Path('audit_input/market_catalog_target.csv').read_bytes())
          summary={
              'audit_version':'ODDS_AUTH_COVERAGE_H_1.2_CORRECTED','provider':'ODDSPAPI','api_version':'v4',
              'historical_endpoint':'/historical-odds','credential_persisted':False,
              'frozen_window':{'start':'2026-04-01T00:00:00Z','end_exclusive':'2026-05-01T00:00:00Z','expanded':False},
              'benchmark_bookmakers':BOOKS,'horizons_minutes':HORIZONS,'max_odds_age_seconds':MAX_AGE,
              'minimum_eligible_fixtures':MIN_N,'coverage_pass_rate':PASS_RATE,'coverage_partial_floor':PARTIAL,'bookmaker_admission_min_rate':BOOK_ADMIT,
              'eligible_counts':eligible_counts,
              'coverage_cell_status_counts':dict(Counter(x['status'] for x in coverage)),
              'competition_market_status_counts':dict(Counter(x['status'] for x in cm_status)),
              'admitted_bookmaker_cells':sum(x['admitted'] for x in admissions),
              'coverage_cells_total':len(coverage),'expected_coverage_cells':36,
              'historical_api_calls_including_retries':call_count,'rate_limit_or_server_retries':retries,
              'raw_historical_files':len(raw_manifest),'duplicate_timestamp_price_conflicts':duplicate_conflicts,
              'process_complete':len(coverage)==36,'step_h_process_status':'PASS' if len(coverage)==36 else 'FAIL'
          }
          (OUT/'audit_summary_H12.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          hm=[]
          for p in sorted(OUT.rglob('*')):
              if p.is_file() and p.name!='artifact_sha256_manifest_H12.json':
                  b=p.read_bytes(); hm.append({'file':str(p.relative_to(OUT)),'sha256':sha(b),'bytes':len(b)})
          (OUT/'artifact_sha256_manifest_H12.json').write_text(json.dumps(hm,indent=2),encoding='utf-8')
          secret_bytes=key.encode('utf-8')
          for pp in OUT.rglob('*'):
              if pp.is_file() and secret_bytes in pp.read_bytes():
                  raise SystemExit('CREDENTIAL_LEAK:'+str(pp))
          print('CREDENTIAL_PERSISTENCE_SCAN_PASS')
          print(json.dumps(summary,indent=2))
          PYCODE
          rm -f /tmp/api_key.txt /tmp/secret.enc /tmp/private.pem
      - name: Upload corrected historical coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-authenticated-coverage-H12-corrected
          path: h12_output
