name: v3.1.3 TOTAL_CORNERS SHADOW

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      horizon_seconds:
        description: Seconds to keep the exact-time collector alive (maximum 19800)
        required: false
        default: '420'

permissions:
  contents: write

concurrency:
  group: v313-prospective-total-corners
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the immutable authorized cohort
        id: active
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f registries/prospective_active_cohort_v313.json ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          active = json.load(open('registries/prospective_active_cohort_v313.json'))
          assert active['activation_authorized'] is True
          assert active['public_repository_publication_authorized'] is True
          assert active['authorized_public_repository'] == 'lrcdw/Discord'
          assert active['api_key_window_authorized'] is True
          assert active['minimum_quota_reserve'] == 150
          assert active['step_i_allowed'] is False
          expiry = datetime.fromisoformat(active['api_key_authorized_through_utc'].replace('Z', '+00:00'))
          assert datetime.now(timezone.utc) <= expiry
          path = active['cohort_path']
          assert hashlib.sha256(open(path, 'rb').read()).hexdigest() == active['cohort_sha256']
          PY
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Wait for and collect only due pre-registered cells
        if: steps.active.outputs.ready == 'true'
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cohort=$(python -c 'import json; print(json.load(open("registries/prospective_active_cohort_v313.json"))["cohort_path"])')
          horizon='${{ inputs.horizon_seconds }}'
          if [ -z "$horizon" ]; then horizon=420; fi
          python code/run_cloud_window_v313.py --cohort "$cohort" --horizon-seconds "$horizon"
      - name: Synchronize and audit without changing the frozen gates
        if: always() && steps.active.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cohort=$(python -c 'import json; print(json.load(open("registries/prospective_active_cohort_v313.json"))["cohort_path"])')
          python code/sync_prospective_state_v31.py \
            --active registries/prospective_active_cohort_v313.json \
            --collections raw/prospective_v3_1_3/collections
          audit_exit=0
          python code/prospective_total_corners_v313.py audit \
            --cohort "$cohort" \
            --collections-root raw/prospective_v3_1_3/collections \
            --output reports/odds_prospective_v3_1_3_result.json || audit_exit=$?
          test "$audit_exit" -le 1
      - name: Persist immutable attempts before another runner starts
        if: always() && steps.active.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "corners-lab-shadow"
          git config user.email "corners-lab-shadow@users.noreply.github.com"
          git add raw/prospective_v3_1_3/collections reports/odds_prospective_v3_1_3_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist v3.1.3 prospective SHADOW evidence"
          git push origin HEAD:master
      - name: Upload immutable snapshot evidence
        if: always() && steps.active.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v313-prospective-${{ github.run_id }}-${{ github.run_attempt }}
          path: raw/prospective_v3_1_3/collections
          if-no-files-found: warn
          retention-days: 90
