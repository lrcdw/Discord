name: Secure OddsPapi H13 Frozen Holdout v3 Resume

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/secure-oddspapi-h13-v3.yml'

permissions:
  contents: write
  actions: read

env:
  RESUME_ARTIFACT_ID: '9659573456'

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish ephemeral H13 v3 public key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'corners-lab-runner'
          git config user.email 'corners-lab-runner@users.noreply.github.com'
          mkdir -p secure_exchange_h13_v3
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/h13_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/h13_private.pem -pubout -out secure_exchange_h13_v3/public_key.pem >/dev/null 2>&1
          printf '%s\n' "${GITHUB_RUN_ID}" > secure_exchange_h13_v3/session.txt
          git add secure_exchange_h13_v3/public_key.pem secure_exchange_h13_v3/session.txt
          git commit -m "Publish ephemeral H13-v3 public key ${GITHUB_RUN_ID}"
          git push origin HEAD:master
      - name: Resume frozen H13 holdout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/h13_api_key.txt /tmp/h13_private.pem /tmp/h13_secret.enc' EXIT
          CIPHER="secure_exchange_h13_v3/ciphertext_${GITHUB_RUN_ID}.hex"
          for i in $(seq 1 180); do
            git pull --rebase origin master >/dev/null 2>&1 || true
            if [ -s "$CIPHER" ]; then break; fi
            sleep 2
          done
          test -s "$CIPHER"
          tr -d '\r\n ' <"$CIPHER" | xxd -r -p >/tmp/h13_secret.enc
          test "$(stat -c%s /tmp/h13_secret.enc)" -eq 384
          openssl pkeyutl -decrypt -inkey /tmp/h13_private.pem -in /tmp/h13_secret.enc -out /tmp/h13_api_key.txt \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          chmod 600 /tmp/h13_api_key.txt
          test -s /tmp/h13_api_key.txt
          mkdir -p resume_h13
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${RESUME_ARTIFACT_ID}/zip >/tmp/h13_resume.zip
          unzip -q /tmp/h13_resume.zip -d resume_h13
          python .github/scripts/h13_resume_v3.py
      - name: Upload H13 v3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddspapi-h13-frozen-holdout-v3
          path: h13_holdout_v3
          if-no-files-found: warn
          retention-days: 90
